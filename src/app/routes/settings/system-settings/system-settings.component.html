<section class="">
  <h6 class="text-xs mb-2">
    <span
      [routerLink]="['/settings/settings-menu']"
      routerLinkActive="router-link-active"
      class="text-blue-500 cursor-pointer"
      >Settings</span
    >

    > System Settings
  </h6>
  <div class="flex items-end justify-between">
    <div>
      <h1 class="text-xl font-semibold">Organization Settings</h1>
      <h5 class="text-xs font-thin">{{ sysuser?.code }}</h5>
    </div>
  </div>

  <div *ngIf="!LoadUI" class="card">
    <div class="flex flex-wrap">
      <div class="w-full mt-5">
        <p-skeleton styleClass="mb-2" />
        <p-skeleton width="30rem" styleClass="mb-2" />
        <p-skeleton width="10rem" styleClass="mb-2" />
        <p-skeleton height="10rem" styleClass="mb-2" />
        <p-skeleton width="10rem" height="4rem" />
      </div>
    </div>
  </div>

  <!-- sysuser-detail.component.html -->
  <div
    *ngIf="LoadUI"
    class="w-full mx-auto p-6 bg-white mt-5 rounded-lg shadow-md"
  >
    <!-- Branch Information Section -->
    <div class="mb-2">
      <h1 class="text-lg mb-2">Loan Settings</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="space-y-4">
          <div>
            <p class="text-sm text-gray-500">Monthly Fine Rate (%)</p>
            <input
              type="text"
              class="w-full mt-2 border-gray-200 px-3 py-1 bg-gray-50 border placeholder:text-gray-300 rounded-lg"
              placeholder="8 "
              [(ngModel)]="loan_settings.monthly_fine_rate"
            />
          </div>
        </div>
      </div>

      <div class="flex w-full justify-start">
        <button (click)="updateLoanSettings()" class="btn-lg btn-success">
          Save
        </button>
      </div>
    </div>
  </div>
</section>
